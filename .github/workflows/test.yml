name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check game.js
      - run: node tests/game.test.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 > /tmp/game-server.log 2>&1 &
      - run: node tests/browser.smoke.cjs
      - run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GarageTycoon-v1.0.0
          path: dist/GarageTycoon-v1.0.0.zip
          if-no-files-found: error
